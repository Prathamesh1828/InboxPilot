version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inboxpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/inboxpilot
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=False
      # NOTE: Add your GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, etc. here in production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker -B --pool=solo --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/inboxpilot
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=False
      # NOTE: Same environment variables needed here
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # This tells the frontend container where the backend lives (browser still needs localhost:8000 or your domain)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    restart: always

volumes:
  postgres_data:
